<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>質問中 — フルフル取材フォーム</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <!-- ヘッダー N1a -->
  <header class="app-header" role="banner">
    <div class="container">
      <div class="app-header__inner">
        <span class="wordmark">フルフル<span>取材</span></span>
        <a href="index.html" class="header-back" aria-label="入口に戻る">
          <span aria-hidden="true">←</span> 最初に戻る
        </a>
      </div>
    </div>
  </header>

  <!-- 進捗バー（ヘッダー直下・sticky） -->
  <div class="progress-wrap" role="status" aria-label="回答進捗">
    <div class="progress-bar">
      <div
        class="progress-bar__fill"
        id="progress-fill"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      ></div>
    </div>
    <div class="container--form">
      <p class="progress-label" id="progress-label" aria-live="polite">0 / 11 問</p>
    </div>
  </div>

  <main>
    <section class="question-screen" id="question-screen">
      <div class="container--form">

        <!-- 途中保存ができない環境への警告 -->
        <p id="storage-warning" hidden
          style="font-size: var(--text-sm); color: var(--color-ink-faint);
                 margin-bottom: var(--space-md);
                 padding-left: var(--space-sm);
                 border-left: 2px solid var(--color-line);">
          このブラウザでは途中保存ができません（プライベートブラウズ等）。
          最後まで続けて入力してください。
        </p>

        <!-- 質問ナンバー -->
        <p class="question-number" id="question-number">質問 1 / 8</p>

        <!-- 質問文 -->
        <h1 class="question-text" id="question-text">
          この商品は、いつ・どんなきっかけで生まれましたか？
        </h1>

        <!-- ヒント -->
        <p class="question-hint" id="question-hint" hidden></p>

        <!-- 回答テキストエリア -->
        <label for="answer-textarea" class="sr-only">回答を入力してください</label>
        <textarea
          id="answer-textarea"
          class="textarea"
          name="answer"
          rows="5"
          placeholder=""
          aria-label="回答を入力してください"
          autocomplete="off"
          spellcheck="false"
        ></textarea>

        <!-- Enterキーヒント（非モバイル） -->
        <p class="enter-hint" aria-hidden="true">
          <kbd>Enter</kbd> で次へ進む &ensp;／&ensp; <kbd>Shift</kbd> <kbd>Enter</kbd> で改行
        </p>

        <!-- 自動保存バッジ -->
        <div class="autosave-badge" id="autosave-badge" aria-live="polite" aria-atomic="true">
          <span class="autosave-dot" aria-hidden="true"></span>
          自動保存しました
        </div>

        <!-- ナビゲーションボタン -->
        <div class="nav-btns" role="group" aria-label="質問ナビゲーション">
          <button
            type="button"
            class="btn btn-outline"
            id="btn-back"
            aria-label="前の質問に戻る"
          >← 戻る</button>

          <button
            type="button"
            class="btn btn-accent"
            id="btn-next"
          >次へ →</button>

          <button
            type="button"
            class="btn btn-ghost"
            id="btn-skip"
            aria-label="この質問をスキップして次へ"
          >スキップ</button>
        </div>

      </div>
    </section>
  </main>

  <footer class="app-footer" role="contentinfo">
    <div class="container">
      フルフル 商品マスタ取材フォーム — 社内業務用・非公開
    </div>
  </footer>

  <!-- トースト -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- スクリプト（依存順） -->
  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/submit.js"></script>
  <script src="js/app.js"></script>

  <style>
    /* スクリーンリーダー専用 */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    /* モバイルで Enter ヒントを非表示 */
    @media (max-width: 480px) {
      .enter-hint { display: none; }
    }
  </style>

</body>
</html>
